# Configuration de l'application Streamlit — Scoring des Impayés
# Palette 7.1 : bleu nuit (marque), turquoise (paiements), violet (IA),
# échelle d'urgence du vert au noir.
#
# Deux thèmes complets sont définis : clair et sombre. L'utilisateur bascule
# entre les deux (ou suit le système) via le menu ⋮ → Settings → Theme.
# L'application détecte le thème actif (st.context.theme) et adapte ses cartes,
# badges et graphiques en conséquence.

[theme]
base = "light"
primaryColor = "#0FB5AE"
font = "sans serif"
baseRadius = "large"
metricValueFontSize = "1.9rem"
metricValueFontWeight = 800

[theme.light]
backgroundColor = "#F7F9FC"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0F172A"
borderColor = "#E2E8F0"

[theme.dark]
backgroundColor = "#0B1220"
secondaryBackgroundColor = "#111C2E"
textColor = "#E5E7EB"
borderColor = "#1E293B"

[server]
headless = true
maxUploadSize = 50

[browser]
gatherUsageStats = false

[client]
# "auto" laisse le menu ⋮ disponible : c'est lui qui permet de basculer
# entre le thème clair et le thème sombre.
showErrorDetails = "full"
toolbarMode = "auto"

[logger]
level = "warning"
